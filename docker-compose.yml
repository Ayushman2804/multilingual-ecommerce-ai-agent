version: '3.8'

services:
  multilingual-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multilingual_cs_agent
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=false
      - TARGET_TOTAL_LATENCY_MS=3000.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
